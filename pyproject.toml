[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flocons"
version = "0.0.1"
description = "A paper snowflake from a photo to an exactly symmetric SVG of straight-edged polygons"
readme = "README.md"
requires-python = ">=3.12"
# license = "MIT"   # TODO pick one (SPDX id) and add a LICENSE file
# These are what the browser gets: the PyodideLockAddon resolves them from the wheel's metadata.
# Keep them in sync with [feature.runtime] in pixi.toml (tests/test_deps_sync.py checks it).
# Only pure-Python or Pyodide-built packages work here. `new` writes the first list.
dependencies = ["numpy", "scipy", "scikit-image", "matplotlib", "pillow"]

[project.optional-dependencies]
# Desktop-only extras (anything that can't run in Pyodide: pooch, h5py, dask, ...).
# Import them inside functions, never at module top level, so `import flocons` works in the browser.
local = []

[tool.hatch.build.targets.wheel]
packages = ["src/flocons"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ---------------------------------------------------------------- project layer (PROJECT.md)
[tool.lite.publish]
# Files the notebooks write (notebooks/out/, not in git) that are published on purpose, e.g. a
# figure for the README: "copy in git" = "file written by a notebook". `pixi run publish` copies
# them; `pixi run check` fails when a copy is out of date.
# "docs/figure.svg" = "notebooks/out/figure.svg"
"docs/snowflake.svg" = "notebooks/out/snowflake.svg"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]   # cells are not modules: long plot titles are fine
